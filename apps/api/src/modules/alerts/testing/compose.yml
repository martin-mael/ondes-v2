# Silence detection test (#33): one real station engine running the station template (#27),
# rendered by silence.int.test.ts into ./.rendered/station.liq, with a silent file in its
# queue. Same shape as the engine adapter's (modules/engine/adapter/testing/compose.yml).
#
# Its own project name and ports, so it never touches the shared ondes-dev stack or the
# adapter's test project. The test starts it and tears it down; by hand:
#
#   docker compose -p ondes-alerts-it -f apps/api/src/modules/alerts/testing/compose.yml up -d
#   docker compose -p ondes-alerts-it -f apps/api/src/modules/alerts/testing/compose.yml down -v

name: ondes-alerts-it

services:
  icecast:
    image: libretime/icecast:2.5.0-alpine
    entrypoint:
      - sh
      - -c
      - cat /config/icecast.xml > /etc/icecast.xml && exec docker-entrypoint icecast -c /etc/icecast.xml
    environment:
      ICECAST_SOURCE_PASSWORD: ondes-it-source
      ICECAST_HOSTNAME: localhost
    volumes:
      - ../../../../../../deploy/dev/icecast/icecast.xml:/config/icecast.xml:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8000/status-json.xsl]
      interval: 2s
      timeout: 5s
      retries: 30

  # Sine-tone and silent WAVs, written into the shared volume (no binary fixtures in git).
  fixtures:
    image: node:24.22.0-alpine
    working_dir: /repo
    command: [node, engine/spikes/control/fixtures.ts, /media]
    volumes:
      - ../../../../../..:/repo:ro
      - media:/media

  engine:
    # Keep in sync with deploy/compose.dev.yml (ADR 0002 pins 2.4.6).
    image: savonet/liquidsoap:v2.4.6
    command: [/engine/station.liq]
    environment:
      ENGINE_CONTROL_TOKEN: it-token
      ICECAST_SOURCE_PASSWORD: ondes-it-source
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${ALERTS_IT_CONTROL_PORT:-17280}:7000
    volumes:
      - ./.rendered:/engine:ro
      - media:/media:ro
    depends_on:
      fixtures:
        condition: service_completed_successfully
      icecast:
        condition: service_healthy

volumes:
  media:
