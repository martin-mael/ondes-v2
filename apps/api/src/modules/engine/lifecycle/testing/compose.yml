# Engine lifecycle integration test (#35): the production Docker access chain (proxy guard
# and socket proxy, included from deploy/ with a test override) and an Icecast, on their own
# compose project, networks and ports. The test then creates real station engine containers
# through the guard, with a unique name prefix and label, on the `engines` network. It never
# touches the shared ondes-dev stack. The test starts and removes all of it; by hand (the
# test sets ENGINE_CONTAINER_PREFIX and ENGINE_CACHE_ROOT):
#
#   ENGINE_CONTAINER_PREFIX=ondes-lifecycle-it ENGINE_CACHE_ROOT=/tmp/c \
#     docker compose -f apps/api/src/modules/engine/lifecycle/testing/compose.yml up -d --wait
#   docker compose -f apps/api/src/modules/engine/lifecycle/testing/compose.yml down -v

name: ondes-engine-lifecycle-it

include:
  - path:
      - ../../../../../../../deploy/engine/docker-socket-proxy.compose.yml
      - ./compose.guard-override.yml
    env_file: ./compose.env

services:
  # Icecast with the station's per-mount source password: the test writes icecast.xml into
  # ICECAST_CONFIG_DIR before starting it.
  icecast:
    image: libretime/icecast:2.5.0-alpine
    entrypoint:
      - sh
      - -c
      - cat /config/icecast.xml > /etc/icecast.xml && exec docker-entrypoint icecast -c /etc/icecast.xml
    volumes:
      - ${ICECAST_CONFIG_DIR:-./icecast}:/config:ro
    networks: [engines]
    ports:
      - 127.0.0.1:${ENGINE_LIFECYCLE_IT_ICECAST_PORT:-17191}:8000
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8000/status-json.xsl]
      interval: 2s
      timeout: 5s
      retries: 30

networks:
  # The network the lifecycle puts engines on (ENGINE_NETWORK), with a fixed name.
  engines:
    name: ondes-engine-lifecycle-it
