# Docker socket proxy for the station engine lifecycle (#35).
#
# The api manages one Liquidsoap container per station, but it never gets the Docker socket.
# It talks to this proxy (`ENGINE_DOCKER_URL=http://docker-socket-proxy:2375`), an HAProxy
# that only forwards the Engine API sections enabled below and refuses everything else
# with 403. Include or extend this service from the production compose file; the lifecycle
# integration test extends it too, so the allowlist is tested.
#
# Rules:
# - Never publish port 2375. Put the proxy on an internal network shared with the api only:
#   anything that reaches it can create containers.
# - The socket is mounted read-only (that only stops the proxy replacing the socket file;
#   the API it forwards is still read-write, hence the allowlist).
#
# What the lifecycle needs, and why (see apps/api/src/modules/engine/lifecycle/README.md):
#   CONTAINERS  create, inspect, list, archive upload (the rendered script), update (restart
#               policy), start, stop, remove. /containers/{id}/exec can be created but never
#               run: /exec (EXEC) stays denied.
#   IMAGES      pull the pinned Liquidsoap image when the host doesn't have it yet.
#   POST        allow non-GET methods at all (create, start, stop, PUT archive, DELETE).
#   ALLOW_START / ALLOW_STOP / ALLOW_RESTARTS  explicit, though CONTAINERS covers them.
# Everything else (exec, networks, volumes, build, swarm, secrets, system, events) is off.

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      PING: 1
      VERSION: 1
      EVENTS: 0
      EXEC: 0
      NETWORKS: 0
      VOLUMES: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      INFO: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      AUTH: 0
      GRPC: 0
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
      - /tmp
      - /var/lib/haproxy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
