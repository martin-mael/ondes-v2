name: Images

# Publishes the production images to GHCR from main. On PRs it only builds them (no push), and
# only when a change can break the build: the images copy the sources as they are (no build
# step, ADR 0005), so what can fail is the Dockerfiles and the filtered `pnpm install` (package
# manifests, lockfile, workspace). Source changes can't, and main still builds every commit.
# Not a required check: when it doesn't run, it reports nothing.
on:
  pull_request:
    paths:
      - deploy/docker/**
      - '**/package.json'
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .dockerignore
      - .github/workflows/images.yml
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to GHCR (only used on main)
    strategy:
      fail-fast: false
      matrix:
        # TODO(#9): add `web` once the Vite app exists (static build served by Caddy).
        # TODO(#13): add `engine` once the Liquidsoap 2.4.x base image is pinned.
        image: [api, worker]
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/ondes-${{ matrix.image }}
          # Immutable tag: the full git SHA. `main` moves with the branch.
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable={{is_default_branch}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/${{ matrix.image }}.Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
