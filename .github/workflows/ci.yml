name: CI

# On PRs, the `changes` job decides which jobs a change needs (path filters below); the
# others are skipped. Pushes to main and manual runs (workflow_dispatch) run everything, and so
# does a PR with the `ci:full` label, which is how to force a full run that gates a PR (a
# dispatch run isn't the PR's pull_request run). Branch protection should require only `CI ok`:
# skipped jobs report as skipped, and `CI ok` fails if any job it needs failed or was cancelled.
on:
  pull_request:
    # `labeled` so that adding `ci:full` starts a full run (see the concurrency rule for others).
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per PR/branch; superseded PR runs are cancelled, main runs always finish.
  # Adding a label other than `ci:full` doesn't cancel the run in flight: its run queues behind
  # it. It isn't skipped instead, because skipped jobs (`CI ok` included) would report as
  # passed on the same commit and could hide the real run's failure.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'ci:full') }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's files through the API
    outputs:
      web: ${{ steps.full.outputs.full == 'true' || steps.filter.outputs.web == 'true' }}
      engine: ${{ steps.full.outputs.full == 'true' || steps.filter.outputs.engine == 'true' }}
      integration: ${{ steps.full.outputs.full == 'true' || steps.filter.outputs.integration == 'true' }}
      # The engine integration tests run the station template in a real Liquidsoap.
      integration-engine: ${{ steps.full.outputs.full == 'true' || steps.filter.outputs.integration == 'true' || steps.filter.outputs.engine == 'true' }}
      integration-worker: ${{ steps.full.outputs.full == 'true' || steps.filter.outputs.worker == 'true' }}
    steps:
      - id: full
        env:
          FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: echo "full=$FULL" >> "$GITHUB_OUTPUT"
      - id: filter
        if: steps.full.outputs.full != 'true'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Dependencies, the toolchain and this workflow can affect every job.
          filters: |
            tooling: &tooling
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .nvmrc
              - tsconfig.base.json
              - .github/workflows/ci.yml
            web:
              - *tooling
              - apps/web/**
              - packages/shared/**
            # The template is rendered by the api's engine config module, which (like
            # engine/tests) imports @ondes/shared. The splice test renders its FLAC islands
            # with the worker's island renderer (#56), which uses ingest's ffmpeg helpers.
            engine:
              - *tooling
              - engine/**
              - apps/api/src/modules/engine/config/**
              # The template test plays the bodies the feeder builds (#57).
              - apps/api/src/modules/engine/feeder/push.ts
              - apps/worker/src/jobs/island-render/**
              - apps/worker/src/jobs/ingest/ffmpeg.ts
              - packages/shared/**
              - deploy/compose.dev.yml
            integration:
              - *tooling
              - apps/api/**
              # The markers engine test (#52) plays the api's feeder into the template.
              - engine/tests/markers/**
              - packages/**
              - deploy/compose.dev.yml
              - deploy/dev/**
              - vitest.integration.config.ts
            worker:
              - *tooling
              - apps/worker/**
              - apps/api/src/modules/library/**
              # The live recording test (#67) runs the station template on the real engine
              # through the api's recorder and the engine adapter.
              - engine/templates/**
              - apps/api/src/modules/engine/config/**
              - apps/api/src/modules/engine/adapter/**
              - apps/api/src/modules/live/recording/**
              - packages/**
              - deploy/docker/worker.Dockerfile
              - deploy/compose.dev.yml
              - deploy/dev/**
              - vitest.integration.config.ts

  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version comes from "packageManager" in package.json.
      - &pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - &node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
      - &install
        run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  web:
    name: Web build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - run: pnpm --filter @ondes/web build

  # The integration tests are split into the projects of vitest.integration.config.ts, one job
  # each, so they run in parallel and only when needed.
  integration:
    name: Integration (core)
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Service versions mirror deploy/compose.dev.yml (#4); keep them in sync.
    # Garage (S3) isn't a service container: it needs its config file and a bootstrap step,
    # so it's started from compose.dev.yml below.
    services: &services
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ondes
          POSTGRES_PASSWORD: ondes
          POSTGRES_DB: ondes
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ondes -d ondes"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:4
        env:
          RABBITMQ_DEFAULT_USER: ondes
          RABBITMQ_DEFAULT_PASS: ondes
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 10s --health-retries 30
    env: &integration-env
      DATABASE_URL: postgres://ondes:ondes@localhost:5432/ondes
      RABBITMQ_URL: amqp://ondes:ondes@localhost:5672
      # Dev-only Garage key from .env.example, same defaults as compose.dev.yml.
      S3_ENDPOINT: http://127.0.0.1:3900
      S3_REGION: garage
      S3_BUCKET: ondes-dev
      S3_ACCESS_KEY_ID: GK6f6e6465732d6465762d6b65
      S3_SECRET_ACCESS_KEY: fc0e6e6f0bb08c084598a6494af6fc8299054cfbcb7e11d28c2241aeb3b54ee8
      S3_FORCE_PATH_STYLE: 'true'
    steps:
      - *checkout
      - *pnpm
      - *node
      - &garage
        name: Start Garage (S3)
        run: |
          docker compose -f deploy/compose.dev.yml up -d --wait garage
          docker compose -f deploy/compose.dev.yml run --rm garage-init
      - *install
      - run: pnpm test:integration --project core

  integration-engine:
    name: Integration (engine)
    needs: changes
    if: needs.changes.outputs.integration-engine == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services: *services
    env: *integration-env
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      # Outside any package: `pnpm typecheck` doesn't see it.
      - run: pnpm exec tsc --noEmit -p engine/tests/markers
      # These tests start their own Liquidsoap/Icecast compose projects (testing/compose.yml).
      - run: pnpm test:integration --project engine

  integration-worker:
    name: Integration (worker)
    needs: changes
    if: needs.changes.outputs.integration-worker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services: *services
    env: *integration-env
    steps:
      - *checkout
      - *pnpm
      - *node
      - *garage
      # The worker's job tests (ingest #18, …) run the worker image's own ffmpeg (7.1 with
      # libsoxr), through the docker wrappers in apps/worker/test/bin. The stage only depends
      # on the base image and apt, so it's cached as a `docker save` tarball keyed on the
      # Dockerfile and the ISO week: `docker load` takes seconds, where a buildx GHA layer
      # cache still pays for the export and load into Docker. The week makes it pick up new
      # ffmpeg 7.1.x security builds from apt at least weekly.
      - id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ondes-ffmpeg.tar
          key: ondes-ffmpeg-${{ hashFiles('deploy/docker/worker.Dockerfile') }}-${{ steps.week.outputs.week }}
      - name: Build the worker image's ffmpeg stage
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          TAR: ${{ runner.temp }}/ondes-ffmpeg.tar
        run: |
          docker build --target ffmpeg -t ondes-ffmpeg:dev -f deploy/docker/worker.Dockerfile .
          docker save ondes-ffmpeg:dev -o "$TAR"
      - name: Load the cached ffmpeg stage
        if: steps.ffmpeg-cache.outputs.cache-hit == 'true'
        run: docker load -i "$RUNNER_TEMP/ondes-ffmpeg.tar"
      - run: echo "$GITHUB_WORKSPACE/apps/worker/test/bin" >> "$GITHUB_PATH"
      - *install
      - run: pnpm test:integration --project worker

  engine:
    name: Engine templates
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - *pnpm
      - *node
      # The station template is rendered from settings by the api's engine config module.
      - *install
      # Same as `pnpm test:engine`; the Liquidsoap image tag comes from deploy/compose.dev.yml.
      - run: sh engine/tests/run.sh

  splice:
    name: Engine island splice (FLAC)
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - *checkout
      - *pnpm
      - *node
      # The template and splice tests need a native ffmpeg. The Ubuntu mirror sometimes crawls
      # (an install ran into the job's timeout), so the downloaded packages are cached: apt then
      # fetches only what changed since, and the week key still picks up security updates.
      - id: apt-week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-ffmpeg-ubuntu-24.04-${{ steps.apt-week.outputs.week }}
          restore-keys: apt-ffmpeg-ubuntu-24.04-
      - name: Install ffmpeg
        timeout-minutes: 10
        env:
          ARCHIVES: ${{ runner.temp }}/apt-archives
        run: |
          mkdir -p "$ARCHIVES/partial"
          sudo apt-get update -q -o Acquire::Retries=3
          sudo apt-get install -yq --no-install-recommends -o Acquire::Retries=3 \
            -o Dir::Cache::Archives="$ARCHIVES" ffmpeg
          sudo rm -rf "$ARCHIVES/partial" "$ARCHIVES/lock"
          sudo chown -R "$USER" "$ARCHIVES"
      - *install
      # Re-validates the island splice rules (ADR / spike #12) against the pinned Liquidsoap
      # image, so a Liquidsoap bump that changes seek or cue rounding fails here.
      - run: pnpm test:engine:splice --quick
      # The station template plays an island segment with no seam, through its control API.
      - run: pnpm test:engine:template

  # The one check to require in branch protection. Skipped jobs count as passed; a failed or
  # cancelled one fails this job.
  ci-ok:
    name: CI ok
    needs: [changes, check, web, integration, integration-engine, integration-worker, engine, splice]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          test "$FAILED" = false
