name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One run per PR/branch; superseded PR runs are cancelled, main runs always finish.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Service versions mirror deploy/compose.dev.yml (#4); keep them in sync.
    # Garage (S3) isn't a service container: it needs its config file and a bootstrap step,
    # so it's started from compose.dev.yml below.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ondes
          POSTGRES_PASSWORD: ondes
          POSTGRES_DB: ondes
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ondes -d ondes"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:4
        env:
          RABBITMQ_DEFAULT_USER: ondes
          RABBITMQ_DEFAULT_PASS: ondes
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 10s --health-retries 30
    env:
      DATABASE_URL: postgres://ondes:ondes@localhost:5432/ondes
      RABBITMQ_URL: amqp://ondes:ondes@localhost:5672
      # Dev-only Garage key from .env.example, same defaults as compose.dev.yml.
      S3_ENDPOINT: http://127.0.0.1:3900
      S3_REGION: garage
      S3_BUCKET: ondes-dev
      S3_ACCESS_KEY_ID: GK6f6e6465732d6465762d6b65
      S3_SECRET_ACCESS_KEY: fc0e6e6f0bb08c084598a6494af6fc8299054cfbcb7e11d28c2241aeb3b54ee8
      S3_FORCE_PATH_STYLE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
      - name: Start Garage (S3)
        run: |
          docker compose -f deploy/compose.dev.yml up -d --wait garage
          docker compose -f deploy/compose.dev.yml run --rm garage-init
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  engine:
    name: Engine templates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same as `pnpm test:engine`; the Liquidsoap image tag comes from deploy/compose.dev.yml.
      - run: sh engine/tests/run.sh
