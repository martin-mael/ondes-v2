name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One run per PR/branch; superseded PR runs are cancelled, main runs always finish.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Service versions mirror deploy/compose.dev.yml (#4); keep them in sync.
    # TODO: add MinIO (S3) here when @ondes/storage gets integration tests.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ondes
          POSTGRES_PASSWORD: ondes
          POSTGRES_DB: ondes
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ondes -d ondes"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:4
        env:
          RABBITMQ_DEFAULT_USER: ondes
          RABBITMQ_DEFAULT_PASS: ondes
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 10s --health-retries 30
    env:
      DATABASE_URL: postgres://ondes:ondes@localhost:5432/ondes
      RABBITMQ_URL: amqp://ondes:ondes@localhost:5672
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  # TODO(#13): add an `engine` job running `pnpm test:engine` once the Liquidsoap image is pinned.
